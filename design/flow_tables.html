<style>
  /* Layout: a script-supervisor's binder. Title block, tab strip, then one wide table per sheet,
     grouped by step or substep with band rows; IDs set in mono like a production sheet. */
  :root {
    --bg: #f5f4f1;
    --surface: #ffffff;
    --band: #efe9df;
    --ink: #1e1a16;
    --muted: #6a625a;
    --line: #e0d9cf;
    --accent: #a8640f;          /* yolk, dark enough to read as text */
    --accent-soft: #f6e7cc;
    --c-perfect: #2f7a3a; --b-perfect: #e0f0dc;
    --c-ok: #3f7a5e;      --b-ok: #e3f1ea;
    --c-recover: #8a6200; --b-recover: #fbefc8;
    --c-degrade: #a5480f; --b-degrade: #fbe0cc;
    --c-fatal: #a3261c;   --b-fatal: #f8d8d3;
    --font-display: 'Bodoni Moda', 'Didot', Georgia, serif;
    --font-body: 'Instrument Sans', 'Segoe UI', system-ui, sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #151311; --surface: #1d1a17; --band: #29241f; --ink: #f1ebe3; --muted: #aa9f92; --line: #3a332c;
    --accent: #f0b14a; --accent-soft: #3b2c14;
    --c-perfect: #9fd49a; --b-perfect: #1f3320; --c-ok: #9ccfb6; --b-ok: #1c3029;
    --c-recover: #f2cf6b; --b-recover: #3a3014; --c-degrade: #f3a970; --b-degrade: #3f2615;
    --c-fatal: #f2928a; --b-fatal: #44201c; color-scheme: dark; } }
  :root[data-theme="dark"] {
    --bg: #151311; --surface: #1d1a17; --band: #29241f; --ink: #f1ebe3; --muted: #aa9f92; --line: #3a332c;
    --accent: #f0b14a; --accent-soft: #3b2c14;
    --c-perfect: #9fd49a; --b-perfect: #1f3320; --c-ok: #9ccfb6; --b-ok: #1c3029;
    --c-recover: #f2cf6b; --b-recover: #3a3014; --c-degrade: #f3a970; --b-degrade: #3f2615;
    --c-fatal: #f2928a; --b-fatal: #44201c; color-scheme: dark; }

  body {
    background: var(--bg); color: var(--ink); font: 14px/1.5 var(--font-body);
    padding-block: 28px 48px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .wrap { max-width: 1500px; margin: 0 auto; display: grid; gap: 18px; }
  header { display: grid; gap: 4px; }
  .eyebrow { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
  h1 { font: 500 clamp(30px, 4.5vw, 44px)/1.05 var(--font-display); margin: 0; text-wrap: balance; }
  .counts { color: var(--muted); margin: 4px 0 0; font-variant-numeric: tabular-nums; }

  nav { display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid var(--line); }
  nav button {
    font: 500 14px var(--font-body); color: var(--muted); background: none; border: 0;
    padding: 9px 12px; border-bottom: 2px solid transparent; margin-bottom: -1px; cursor: pointer;
  }
  nav button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
  nav button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .controls label { font-size: 12px; color: var(--muted); display: grid; gap: 3px; }
  select, input[type="search"] {
    font: 14px var(--font-body); color: var(--ink); background: var(--surface);
    border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; min-width: 0;
  }
  input[type="search"] { width: min(320px, 100%); }
  .hint { font-size: 12.5px; color: var(--muted); margin: 0; flex: 1 1 260px; min-width: 0; align-self: end; }
  .controls label { min-width: 0; max-width: 100%; }
  select { max-width: 100%; }

  .scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); max-height: 78vh; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  thead th {
    position: sticky; top: 0; z-index: 1; background: var(--ink); color: var(--bg);
    text-align: left; font-weight: 600; font-size: 12px; padding: 8px 10px; white-space: nowrap;
  }
  td { padding: 8px 10px; border-top: 1px solid var(--line); vertical-align: top; }
  td.long { min-width: 260px; max-width: 460px; }
  td.mid { min-width: 150px; max-width: 260px; }
  td.id { font: 500 12px var(--font-mono); white-space: nowrap; color: var(--accent); }
  td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  tr.band td { background: var(--band); font-weight: 600; border-top: 1px solid var(--line); }
  tr.band .band-meta { font-weight: 400; color: var(--muted); margin-left: 8px; }
  mark { background: var(--accent-soft); color: inherit; border-radius: 2px; }

  .chip { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
  .chip.Perfect, .chip.Correct { color: var(--c-perfect); background: var(--b-perfect); }
  .chip.Acceptable { color: var(--c-ok); background: var(--b-ok); }
  .chip.Recoverable { color: var(--c-recover); background: var(--b-recover); }
  .chip.Degraded { color: var(--c-degrade); background: var(--b-degrade); }
  .chip.Fatal, .chip.Incorrect { color: var(--c-fatal); background: var(--b-fatal); }
  .chip.type { color: var(--ink); background: var(--band); font-weight: 500; }

  dl.sheet { display: grid; grid-template-columns: minmax(140px, 220px) minmax(0, 1fr); margin: 0;
             background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  dl.sheet dt, dl.sheet dd { margin: 0; padding: 9px 14px; border-top: 1px solid var(--line); }
  dl.sheet dt { font-weight: 600; color: var(--muted); }
  dl.sheet dt.section, dl.sheet dd.section { background: var(--band); color: var(--ink); }
  dl.sheet > :nth-child(-n+2) { border-top: 0; }
  pre.ticket { font: 500 13px/1.5 var(--font-mono); margin: 0; white-space: pre-wrap; }
  .empty { padding: 18px; color: var(--muted); }
  @media (max-width: 560px) { dl.sheet { grid-template-columns: minmax(0, 1fr); } dl.sheet dd { border-top: 0; padding-top: 0; } }
</style>

<script>
const DATA = {"Order": [["Ticket", ""], ["Order no.", "014"], ["Table", "6"], ["Time placed", "19:42 (sim clock starts at 0:00)"], ["Customer", "Saumya (fictional), with a friend"], ["Covers", "2"], ["Dish", "Spaghetti carbonara × 2"], ["Dietary", "No meat: swap guanciale for tofu. Eats eggs and dairy."], ["Requests", "Roman-style, so no cream. Extra-crispy tofu."], ["Target time", "25 minutes (sim time) from order to service"], ["Printed ticket text", "#014  T6  2 COVERS\n2x SPAGH CARBONARA (ROMAN)\n  ** NO MEAT -> TOFU **\n  tofu extra crispy\n19:42"], ["Opening scene", ""], ["Setting", "Evening service. The ticket printer chatters; the ticket slides onto the rail above the counter."], ["Customer line 1", "\"Hi! Could we get two of the carbonara in Roman-style, please?\""], ["Customer line 2", "\"Neither of us eats meat, though. Could you do it with tofu instead of the guanciale?\""], ["Customer line 3", "\"If the tofu could be extra crispy, that would be amazing.\""], ["Server line (to kitchen)", "\"Two carbonara for Table 6. Roman-style. No meat, tofu instead. Extra-crispy tofu!\""], ["Nonna Pina intro (modal)", "\"A tofu carbonara! Same technique, new star. Read the ticket carefully: every word on it changes something we do. Ready?\""], ["Intro button", "Start cooking"], ["Learning goals", ""], ["Goal 1", "Adapt a recipe to a dietary requirement without losing what makes it work."], ["Goal 2", "Understand why tofu is pressed and fried in hot oil while guanciale starts in a cold pan."], ["Goal 3", "Build an emulsion from egg, cheese, fat and starchy pasta water, with no cream."], ["Goal 4", "Control egg temperature: thickens at ~62 °C, scrambles above 70 °C."], ["Success criteria", "Silky, glossy sauce; crisp tofu; well seasoned, not salty; served within the target time."]], "Flow": {"head": ["Step", "Step title", "Substep ID", "Substep title", "Type", "Required?", "Left panel: instruction / question", "Right panel shows", "Chef tip at start (ID)", "Camera view", "Pass rule", "Feedback if incomplete (multi-select)", "Max attempts", "On pass →", "Learning point (science)", "Scene state on entry", "Notes"], "rows": [["1", "Read the order and set up", "S1.1", "Confirm the order", "MCQ - Single select", "Yes", "Table 6 wants two plates of carbonara. What exactly did they ask for?", "Four order summaries (cards)", "T-1.1", "Counter", "Select the one correct summary.", "", "2", "S1.2", "Reading the brief is the first cooking skill: dietary needs and 'Roman-style' change the whole plan.", "Order ticket pinned above the counter; empty counter.", ""], ["1", "Read the order and set up", "S1.2", "Bring the tools", "MCQ - Multi select", "Yes", "First, the equipment. Choose the tools for the job.", "Equipment cards (12)", "", "Counter", "All Correct items selected and no Incorrect items.", "You're missing a tool. Think through each stage: press, cut, boil, fry, grate, whisk, move pasta, save water.", "3", "S1.3", "No colander: the pasta moves straight from pot to pan with tongs, carrying starchy water with it.", "Empty counter; the chosen tools appear together when the picks pass the check.", ""], ["1", "Read the order and set up", "S1.3", "Bring the ingredients to the table", "MCQ - Multi select", "Yes", "Now the ingredients. Pick everything you need for two plates of tofu carbonara. Leave out anything that doesn't belong.", "Pantry and fridge items (14 cards)", "T-1.3", "Counter", "All Correct items selected and no Incorrect items. Acceptable items allowed.", "Something's missing. Check the order again: pasta, protein, eggs, cheese, seasoning and something to cook the tofu in.", "3", "S2.1", "Carbonara is only five ingredients, so each one matters. No cream: the creaminess comes from egg, cheese, fat and starchy water.", "Tools on the counter; the chosen ingredients appear together when the picks pass the check.", "Decoys teach the classic mistakes (cream, garlic, meat)."], ["2", "Prep the tofu", "S2.1", "Press the tofu", "Procedure", "Yes", "Extra-firm tofu holds a lot of water. Set it up to press.", "Tofu, 2 kitchen towels, heavy pan", "T-2.1", "Cutting board", "Actions A-2.1-01 to 04 in order.", "", "3", "S2.2", "Water on the surface turns to steam and stops browning. Dry tofu crisps; wet tofu steams.", "Tofu package on the board.", ""], ["2", "Prep the tofu", "S2.2", "Choose the pressing time", "MCQ - Single select", "Yes", "How long do you leave the tofu under the weight?", "Timer options (4)", "", "Cutting board", "Select the Correct option.", "", "2", "S2.3", "15-20 minutes removes most surface water. Use the time to get the pasta water on.", "Tofu stack with weight on top.", "Timer fast-forwards; the scene shows water pooling on the towel."], ["2", "Prep the tofu", "S2.3", "Cut the tofu into cubes", "Procedure", "Yes", "Cut the pressed tofu into 1 cm cubes, the same size as classic guanciale pieces.", "Chef's knife; cutting guides appear on the tofu", "T-2.3", "Cutting board", "Actions A-2.3-01 to 04 in order.", "", "3", "S2.4", "Even 1 cm cubes cook at the same rate and give the most crisp surface per bite.", "Pressed tofu block on the board.", "Cutting pattern: slabs, then strips, then cubes."], ["2", "Prep the tofu", "S2.4", "Season the tofu", "MCQ - Single select", "No", "Guanciale brings salty, smoky, savoury flavour. How do you give the tofu some of that?", "Seasoning options (4)", "T-2.4", "Cutting board", "Select the Correct option.", "", "2", "S3.1", "Soy sauce adds savoury depth (umami); smoked paprika adds smokiness. Go light: pecorino is already very salty.", "Tofu cubes in a bowl.", "Optional substep: skipping it gives a Degraded 'bland' note."], ["3", "Get the pasta water going", "S3.1", "Fill and heat the pasta pot", "Procedure", "Yes", "Get a big pot of water heating for the spaghetti.", "Large pot, lid", "T-3.1", "Sink", "Actions A-3.1-01 to 05 in order.", "", "3", "S4.1", "Water takes about 10 minutes to boil, so start it early and prep while it heats.", "Pot on the counter next to the sink.", "Salt goes in later (S6.1), once the water boils."], ["4", "Crisp the tofu", "S4.1", "Choose how to start the pan", "MCQ - Single select", "Yes", "The classic recipe starts guanciale in a cold pan. How should you start the tofu?", "Four ways to start the pan", "T-4.1", "Stove", "Select the Correct option.", "", "2", "S4.2", "Guanciale starts cold so its fat can melt out slowly. Tofu has almost no fat, so it needs hot oil to crisp instead of stick.", "Empty skillet on the front burner; burner off.", "Key adaptation moment from guanciale to tofu."], ["4", "Crisp the tofu", "S4.2", "Fry the tofu until golden", "Procedure", "Yes", "Heat the oil, then fry the tofu until golden and crisp on most sides.", "Olive oil, tofu cubes, tongs, smoked paprika and soy (if seasoned)", "T-4.2", "Stove", "Actions A-4.2-01 to 07 in order; heat and wait times inside the target ranges.", "", "2", "S4.3", "Browning (the Maillard reaction) starts around 140 °C. Moving the tofu too soon tears the crust before it forms.", "Skillet on burner; heat knob at Off.", "Live sim: heat knob, wait-time choices, Peek view to judge colour."], ["4", "Crisp the tofu", "S4.3", "Lift out the tofu, keep the oil", "Procedure", "Yes", "The tofu is crisp. Turn off the heat and set the tofu aside, but keep the flavoured oil in the pan.", "Slotted spoon, plate", "T-4.3", "Stove", "Actions A-4.3-01 to 03 in order.", "", "2", "S5.1", "The oil now carries flavour and becomes the fat in the sauce emulsion. Tofu goes back in at the end so it stays crisp.", "Crisp tofu in the skillet; burner on.", ""], ["5", "Make the egg mixture", "S5.1", "Choose the eggs", "MCQ - Single select", "Yes", "How many eggs for two plates?", "Egg combinations (4)", "", "Counter", "Select the Correct option.", "", "2", "S5.2", "Yolks bring richness and colour; a couple of whole eggs make the sauce looser and easier to handle. Rule: 1 whole + 1 yolk per person, plus 1 yolk 'for the pot'.", "Egg carton and empty bowl on the counter.", ""], ["5", "Make the egg mixture", "S5.2", "Crack and separate the eggs", "Procedure", "Yes", "Crack 2 whole eggs into the bowl, then separate 3 more and add only the yolks.", "Eggs, mixing bowl, small cup for whites", "T-5.2", "Counter", "Actions A-5.2-01 to 03 in order (A-5.2-03 repeated 3 times).", "", "3", "S5.3", "Egg whites set at a lower temperature than yolks, which is one reason extra yolks make a more forgiving sauce.", "Bowl and egg carton on the counter.", ""], ["5", "Make the egg mixture", "S5.3", "Pick the grater", "MCQ - Single select", "Yes", "Which side of the box grater do you use for the pecorino?", "Four grater sides", "T-5.3", "Counter", "Select the Correct option.", "", "2", "S5.4", "Powder-fine cheese melts evenly into the egg. Coarse shreds clump and turn stringy.", "Box grater and a wedge of pecorino on the counter.", ""], ["5", "Make the egg mixture", "S5.4", "Grate, season and whisk", "Procedure", "Yes", "Grate 150 g of pecorino into the eggs, add about ½ tbsp of cracked pepper, and whisk to a thick paste.", "Pecorino, box grater, pepper mill, whisk", "", "Counter", "Actions A-5.4-01 to 03 in order.", "", "2", "S6.1", "Freshly cracked pepper is a main flavour here, not a garnish.", "Bowl with eggs.", "No salt: the cheese brings plenty."], ["6", "Cook the pasta", "S6.1", "Salt the water", "MCQ - Single select", "Yes", "The water is at a rolling boil (about 3 litres). How much salt goes in?", "Salt amounts (4)", "T-6.1", "Stove", "Select the Correct option.", "", "1", "S6.2", "Pasta absorbs salt as it cooks. Salt more lightly than usual for carbonara: the pecorino and soy are salty, and the water goes into the sauce.", "Pot at a rolling boil.", ""], ["6", "Cook the pasta", "S6.2", "Add the spaghetti", "Procedure", "Yes", "Add the spaghetti and stop it from sticking.", "Spaghetti (300 g), tongs", "", "Stove", "Actions A-6.2-01 to 03 in order.", "", "2", "S6.3", "Stirring in the first minute stops the strands sticking while their surface starch is gelatinising.", "Salted water at a rolling boil.", ""], ["6", "Cook the pasta", "S6.3", "Decide when to pull the pasta", "MCQ - Single select", "Yes", "The packet says 11 minutes. When do you take the spaghetti out?", "Times (4)", "T-6.3", "Stove", "Select the Correct option.", "", "1", "S7.1", "The pasta keeps cooking in the pan with the sauce, so it comes out a minute before al dente.", "Spaghetti boiling; timer running.", "Timer fast-forwards to the chosen minute."], ["7", "Bring the sauce together", "S7.1", "Move the pasta into the pan", "Procedure", "Yes", "Save some pasta water first, then move the pasta into the pan with the tofu oil.", "Mug, ladle, tongs", "T-7.1", "Stove", "Actions A-7.1-01 to 04 in order.", "", "2", "S7.2", "Starchy pasta water is the glue that binds fat and egg. It's your insurance if the sauce gets too thick.", "Pasta near al dente; skillet with flavoured oil.", ""], ["7", "Bring the sauce together", "S7.2", "Temper the eggs", "Procedure", "Yes", "Loosen the egg mixture with hot pasta water until it pours like cream.", "Mug of pasta water, whisk, egg bowl", "T-7.2", "Counter", "Actions A-7.2-01 to 03 in order.", "", "2", "S7.3", "Tempering warms the eggs gradually so they aren't shocked by the hot pan. You can always thicken a sauce, but you can't unscramble one.", "Egg paste in the bowl; pasta in the skillet.", ""], ["7", "Bring the sauce together", "S7.3", "Deal with the heat", "MCQ - Single select", "Yes", "The egg mixture is ready. What do you do with the pan before it goes in?", "Heat choices (4)", "T-7.3", "Stove", "Select the Correct option.", "", "1", "S7.4", "Egg yolk starts to thicken around 62 °C and scrambles above 70 °C. A pan on the flame is far hotter than that.", "Pasta tossing in the pan on low heat.", ""], ["7", "Bring the sauce together", "S7.4", "Toss into a silky sauce", "Procedure", "Yes", "Pour in the eggs and keep everything moving until the sauce is thick and glossy, like béchamel.", "Egg mixture, tongs, mug of pasta water, heat knob; live sauce thermometer", "T-7.4", "Peek in the pan", "Actions A-7.4-01 to 03 in order; sauce must end Silky (thickened, no curds).", "", "1", "S8.1", "Thicken with gentle heat, loosen with pasta water. Constant movement keeps any one spot from overheating.", "Pan off the heat; pasta coated in oil.", "Live sim: speed control, heat on/off, splash water, Plate button."], ["8", "Finish and serve", "S8.1", "Choose the toppings", "MCQ - Multi select", "Yes", "What goes on top before it goes out?", "Topping cards (6)", "", "Serving", "All Correct items selected and no Incorrect items.", "Missing something. A Roman carbonara is finished with two things from the ingredients you already have.", "2", "S8.2", "Keep it simple: the toppings repeat the dish's own flavours.", "Two warm bowls on the counter.", ""], ["8", "Finish and serve", "S8.2", "Plate and serve", "Procedure", "Yes", "Fold the tofu back in, twirl each portion into a bowl, top it, and send it out straight away.", "Crisp tofu, tongs, 2 bowls, pepper mill, pecorino, service bell", "T-8.2", "Serving", "Actions A-8.2-01 to 05 in order, within 60 s (sim time).", "", "1", "END", "Carbonara keeps thickening as it cools. Serve it immediately.", "Finished pasta in the pan.", "Leads to the Outcomes screen."]]}, "MCQ Options": {"head": ["Option ID", "Substep ID", "Option label (right panel)", "Item ID", "Correctness", "Outcome", "Chef feedback (on select)", "Branch to", "Score Δ", "State effect"], "rows": [["O-1.1-a", "S1.1", "2 × Roman-style carbonara (no cream), no meat: tofu instead, extra-crispy", "", "Correct", "Perfect", "Exactly. Roman-style means no cream; no meat means tofu, extra crispy. Let's build the plan around that.", "NEXT", "0", "order_confirmed = true"], ["O-1.1-b", "S1.1", "2 × classic carbonara with guanciale", "", "Incorrect", "Recoverable", "Read it again: Saumya doesn't eat meat. That changes our protein.", "RETRY", "-5", ""], ["O-1.1-c", "S1.1", "2 × creamy carbonara with tofu", "", "Incorrect", "Recoverable", "She asked for Roman-style, and a Roman carbonara never has cream. Its creaminess comes from egg, cheese and pasta water.", "RETRY", "-5", ""], ["O-1.1-d", "S1.1", "4 × tofu carbonara, no cream", "", "Incorrect", "Recoverable", "Close, but count again: it's a table for two.", "RETRY", "-5", ""], ["O-1.3-a", "S1.3", "Spaghetti (dried, bronze-cut)", "I-SPAGHETTI", "Correct", "Perfect", "Dried pasta releases more starch into the water than fresh. Perfect.", "NEXT", "0", ""], ["O-1.3-b", "S1.3", "Extra-firm tofu", "I-TOFU", "Correct", "Perfect", "Extra-firm holds its shape and crisps. Silken would fall apart.", "NEXT", "0", ""], ["O-1.3-c", "S1.3", "Eggs", "I-EGGS", "Correct", "Perfect", "The heart of the sauce.", "NEXT", "0", ""], ["O-1.3-d", "S1.3", "Pecorino Romano", "I-PECORINO", "Correct", "Perfect", "Sharp, salty sheep's cheese from Lazio. The classic choice.", "NEXT", "0", ""], ["O-1.3-e", "S1.3", "Black peppercorns", "I-PEPPER", "Correct", "Perfect", "Whole, so we can crack them fresh.", "NEXT", "0", ""], ["O-1.3-f", "S1.3", "Coarse salt", "I-SALT", "Correct", "Perfect", "For the pasta water.", "NEXT", "0", ""], ["O-1.3-g", "S1.3", "Olive oil", "I-OIL", "Correct", "Perfect", "Tofu has no fat to render, so the oil does that job.", "NEXT", "0", ""], ["O-1.3-h", "S1.3", "Soy sauce", "I-SOY", "Acceptable", "Acceptable", "Good thinking: a little soy gives the tofu savoury depth.", "NEXT", "0", ""], ["O-1.3-i", "S1.3", "Smoked paprika", "I-PAPRIKA", "Acceptable", "Acceptable", "Nice. A pinch brings back the smokiness guanciale would have given.", "NEXT", "0", ""], ["O-1.3-j", "S1.3", "Guanciale", "I-GUANCIALE", "Incorrect", "Recoverable", "That's the classic, but our customer doesn't eat meat. Put it back.", "RETRY", "-3", ""], ["O-1.3-k", "S1.3", "Heavy cream", "I-CREAM", "Incorrect", "Recoverable", "No cream! She asked for Roman-style, and in Rome carbonara never has cream.", "RETRY", "-3", ""], ["O-1.3-l", "S1.3", "Garlic", "I-GARLIC", "Incorrect", "Recoverable", "Garlic isn't in carbonara. Keep it for another dish.", "RETRY", "-3", ""], ["O-1.3-m", "S1.3", "Butter", "I-BUTTER", "Incorrect", "Recoverable", "We don't need butter. The oil and egg give us all the richness.", "RETRY", "-3", ""], ["O-1.3-n", "S1.3", "Parsley", "I-PARSLEY", "Incorrect", "Recoverable", "Pretty, but it doesn't belong here.", "RETRY", "-3", ""], ["O-1.2-a", "S1.2", "Large pot with lid", "T-POT", "Correct", "Perfect", "Big pot, lots of room for the spaghetti to move.", "NEXT", "0", ""], ["O-1.2-b", "S1.2", "Heavy skillet (cast iron)", "T-SKILLET", "Correct", "Perfect", "Heavy pans hold heat evenly. Great for crisping tofu.", "NEXT", "0", ""], ["O-1.2-c", "S1.2", "Chef's knife and board", "T-KNIFE", "Correct", "Perfect", "For neat 1 cm cubes.", "NEXT", "0", ""], ["O-1.2-d", "S1.2", "2 clean kitchen towels", "T-TOWELS", "Correct", "Perfect", "To press the water out of the tofu.", "NEXT", "0", ""], ["O-1.2-e", "S1.2", "Box grater", "T-GRATER", "Correct", "Perfect", "We'll use its finest side.", "NEXT", "0", ""], ["O-1.2-f", "S1.2", "Mixing bowl and whisk", "T-BOWL", "Correct", "Perfect", "For the egg mixture.", "NEXT", "0", ""], ["O-1.2-g", "S1.2", "Slotted spoon", "T-SLOTTED", "Correct", "Perfect", "Lifts the tofu out and leaves the oil behind.", "NEXT", "0", ""], ["O-1.2-h", "S1.2", "Tongs", "T-TONGS", "Correct", "Perfect", "To move the pasta straight into the pan.", "NEXT", "0", ""], ["O-1.2-i", "S1.2", "Ladle and mug", "T-MUG", "Correct", "Perfect", "To save pasta water. Don't forget it!", "NEXT", "0", ""], ["O-1.2-j", "S1.2", "Colander", "T-COLANDER", "Incorrect", "Recoverable", "No colander. If we drain the pasta, we pour our best ingredient, the starchy water, down the sink.", "RETRY", "-3", ""], ["O-1.2-k", "S1.2", "Blender", "T-BLENDER", "Incorrect", "Recoverable", "A whisk is all we need. A blender would whip air into the eggs.", "RETRY", "-3", ""], ["O-1.2-l", "S1.2", "Baking tray", "T-TRAY", "Incorrect", "Recoverable", "No oven today. Everything happens on the stove.", "RETRY", "-3", ""], ["O-2.2-a", "S2.2", "No pressing, straight to the knife", "", "Incorrect", "Degraded", "Wet tofu steams and sticks. It'll never get properly crisp.", "NEXT", "-10", "tofu_moisture = high"], ["O-2.2-b", "S2.2", "5 minutes", "", "Incorrect", "Degraded", "A start, but there's still plenty of water inside. It will spit and stay soft.", "NEXT", "-5", "tofu_moisture = medium"], ["O-2.2-c", "S2.2", "15-20 minutes", "", "Correct", "Perfect", "Perfect. And while it presses, we'll get the pasta water on.", "NEXT", "0", "tofu_moisture = low"], ["O-2.2-d", "S2.2", "2 hours", "", "Incorrect", "Recoverable", "It would be very dry, but Table 6 would be gone by then! 15-20 minutes does the job.", "RETRY", "-3", ""], ["O-2.4-a", "S2.4", "Toss with 1 tsp soy sauce and a pinch of smoked paprika", "I-SOY", "Correct", "Perfect", "Savoury and a little smoky. That's our guanciale stand-in. We'll add the paprika at the end of frying so it doesn't burn.", "NEXT", "0", "tofu_seasoned = true"], ["O-2.4-b", "S2.4", "Salt it generously", "I-SALT", "Incorrect", "Degraded", "Careful. Pecorino is very salty, so the dish will be over-salted.", "NEXT", "-5", "salt_level += 1"], ["O-2.4-c", "S2.4", "Soak it in 4 tbsp soy sauce", "I-SOY", "Incorrect", "Degraded", "Too much liquid. We just pressed the water out! Now it won't crisp, and it'll be very salty.", "NEXT", "-10", "tofu_moisture = high; salt_level += 1"], ["O-2.4-d", "S2.4", "Leave it plain", "", "Acceptable", "Degraded", "It will work, but plain tofu is mild. A little seasoning gives the dish its savoury backbone.", "NEXT", "-3", "tofu_seasoned = false"], ["O-4.1-a", "S4.1", "Cold pan, no oil, then heat up (like guanciale)", "", "Incorrect", "Recoverable", "That's the rule for guanciale, because it brings its own fat. Tofu has none, so it would weld itself to the pan.", "RETRY", "-5", ""], ["O-4.1-b", "S4.1", "Cold pan with oil, then heat up" bling.", "NEXT", "-8", "heat = medium"], ["O-7.3-d", "S7.3", "Turn it up so the sauce thickens faster", "", "Incorrect", "Fatal", "The eggs hit a scorching pan and set in seconds. Scrambled eggs on spaghetti.", "GAME_OVER", "-100", "ending = FATAL-SCRAMBLED"], ["O-8.1-a", "S8.1", "Freshly cracked black pepper", "", "Correct", "Perfect", "Yes. A fresh crack for aroma.", "NEXT", "0", ""], ["O-8.1-b", "S8.1", "A dusting of pecorino", "", "Correct", "Perfect", "Yes. A little more on top.", "NEXT", "0", ""], ["O-8.1-c", "S8.1", "Chopped parsley", "", "Incorrect", "Recoverable", "Not on a Roman carbonara. Let's keep it classic.", "RETRY", "-3", ""], ["O-8.1-d", "S8.1", "A drizzle of cream", "", "Incorrect", "Recoverable", "No cream. She ordered it Roman-style!", "RETRY", "-3", ""], ["O-8.1-e", "S8.1", "Chilli flakes", "", "Incorrect", "Recoverable", "Nice on other pastas, but it would drown out the pepper and cheese here.", "RETRY", "-3", ""], ["O-8.1-f", "S8.1", "Extra crispy tofu on top", "", "Acceptable", "Acceptable", "Good idea for an 'extra-crispy' request: a few pieces on top stay crunchiest.", "NEXT", "0", ""]]}, "Procedure Actions": {"head": ["Action ID", "Substep ID", "Order", "Interaction", "Source element / item", "Source location", "Target element", "Parameter / value", "Correctness", "Outcome", "Chef feedback (done right)", "Chef feedback (wrong / out of order)", "Branch to", "Score Δ", "State effect", "Task instruction (left panel)"], "rows": [["A-2.1-01", "S2.1", "1", "Click", "I-TOFU", "Scene", "", "Open the pack", "Correct", "Perfect", "Drain the packing water first.", "Open the pack and drain it before anything else.", "NEXT", "0", "", "Select the tofu and open the pack."], ["A-2.1-02", "S2.1", "2", "Drag", "T-TOWELS", "Right panel", "E-BOARD", "First towel under the tofu", "Correct", "Perfect", "", "The first towel goes on the board, underneath the tofu, to catch the water.", "NEXT", "0", "", "Select the kitchen towels, then the cutting board, to lay t im for 170-200 °C)."], ["A-4.2-02", "S4.2", "2", "Drag", "I-OIL", "Right panel", "T-SKILLET", "2 tbsp olive oil", "Correct", "Perfect", "", "Oil before tofu.", "NEXT", "0", "", "Pour 2 tbsp of olive oil into the skillet."], ["A-4.2-03", "S4.2", "3", "Timer", "E-PAN-OIL", "Scene", "", "Wait until the oil shimmers (about 1 min)", "Correct", "Perfect", "See it ripple? That's hot enough.", "Wait for the shimmer, or the tofu will stick.", "NEXT", "0", "", "Wait until the oil shimmers, about 1 minute."], ["A-4.2-04", "S4.2", "4", "Drag", "I-TOFU", "Scene", "T-SKILLET", "Tofu cubes in a single layer", "Correct", "Perfect", "Listen to that sizzle.", "", "NEXT", "0", "tofu_in_pan = true", "Add the tofu cubes to the skillet in a single layer."], ["A-4.2-05", "S4.2", "5", "Timer", "E-TIMER", "Scene", "", "Leave undisturbed 3 min (choices: 1 / 3 / 6 min)", "Correct", "Perfect", "", "Don't touch it yet: the crust needs time to form.", "NEXT", "0", "", "Set the timer and leave the cubes alone so they can brown."], ["A-4.2-06", "S4.2", "6", "Click", "T-TONGS", "Right panel", "T-SKILLET", "Toss / turn the cubes", "Correct", "Perfect", "Golden underneath. Now the other sides.", "", "NEXT", "0", "", "Use the tongs to turn the cubes over."], ["A-4.2-07", "S4.2", "7", "Timer", "E-TIMER", "Scene", "", "Another 3-4 min, then add soy and paprika for the last 30 s", "Correct", "Perfect", "Crisp, golden and smoky.", "", "NEXT", "0", "tofu_state = crisp", "Cook 3-4 minutes more; add the soy sauce and paprika in the last 30 seconds."], ["A-4.2-08", "S4.2", "-", "Click", "T-TONGS", "Right panel", "T-SKILLET", "Toss in the first minute", "Incorrect", "Degraded", "", "Too soon! The crust tore and stuck to the pan. Let it sit next time.", "NEXT", "-5", "tofu_torn = true", ""], ["A-4.2-09", "S4.2", "-", "Slider / knob", "E-KNOB-FRONT", "Scene", "", "High for more than 4 min", "Incorrect", "Fatal", "", "Smoke! The tofu and oil have burnt. Bitter, acrid and not servable.", "GAME_OVER", "-100", "ending = FATAL-BURNT", ""], ["A-4.2-10", "S4.2", "-", "Drag", "I-PAPRIKA", "Right panel", "T-SKILLET", "Paprika at the start of frying", "Incorrect", "Degraded", "", "Paprika burns fast and turns bitter. Add it in the last 30 seconds.", "NEXT", "-5", "paprika_bitter = true", ""], ["A-4.3-01", "S4.3", "1", "Slider / knob", "E-KNOB-FRONT", "Scene", "", "Off", "Correct", "Perfect", "", "Heat off first.", "NEXT", "0", "", "Turn the front burner knob to Off."], ["A-4.3-02", "S4.3", "2", "Drag", "T-SLOTTED", "Right panel", "T-SKILLET", "Lift the tofu out (oil drains back)", "Correct", "Perfect", "", "", "NEXT", "0", "", "With the slotted spoon, lift the tofu out and let the oil drain back into the pan."], ["A-4.3-03", "S4.3", "3", "Drag", "T-SLOTTED", "Scene", "E-PLATE", "Tofu onto the plate", "Correct", "Perfect", "Set aside. It goes back in at the very end.", "", "NEXT", "0", "tofu_reserved = true", "Put the tofu on the resting plate."], ["A-4.3-04", "S4.3", "-", "Drag", "T-SKILLET", "Scene", "E-SINK", "Pour the oil away", "Incorrect", "Recoverable", "", "That oil was flavour! Add 1 tbsp fresh oil to the pan, but the sauce will taste a little flatter.", "NEXT", "-5", "fat_flavour = plain", ""], ["A-4.3-05", "S4.3", "-", "Click", "T-SKILLET", "Scene", "", "Leave the tofu in the pan", "Incorrect", "Degraded", "", "In the sauce it will soak up liquid and go soft. Crispy tofu was the request!", "NEXT", "-5", "tofu_state = soggy", ""], ["A-5.2-01", "S5.2", "1", "Drag", "T-BOWL", "Right panel", "E-COUNTER", "Bowl onto the counter", "Correct", "Perfect", "", "", "NEXT", "0", "", "Pick the mixing bowl and put it on the counter."], ["A-5.2-02", "S5.2", "2", "Repeat click", "I-EGGS", "Right panel", "T-BOWL", "Crack 2 whole eggs into the bowl (×2)", "Correct", "Perfect", "", "", "NEXT", "0", "", "Tap the eggs to crack 2 whole eggs into the bowl."], ["A-5.2-03", "S5.2", "3", "Repeat click", "I-EGGS", "Right panel", "E-WHITES-CUP", "Separate: pass the yolk between the shell halves, whites into the cup, yolk into the bowl (×3)", "Correct", "Perfect", "Lovely golden yolks.", "Whole eggs first, then the extra yolks.", "NEXT", "0", "yolks_added = 3", "Separate 3 more eggs: whites go into the cup, yolks into the bowl."], ["A-5.2-04", "S5.2", "-", "Click", "I-EGGS", "Right panel", "T-BOWL", "Shell fragment falls in", "Incorrect", "Recoverable", "", "A bit of shell got in. Scoop it out with a larger piece of shell, it works like a magnet.", "NEXT", "0", "", ""], ["A-5.4-01", "S5.4", "1", "Hold", "I-PECORINO", "Right panel", "T-BOWL", "Grate 150 g on the chosen side (scale shows grams)", "Correct", "Perfect", "", "", "NEXT", "0", "cheese_g = 150", "Hold to grate 150 g of pecorino into the bowl. Watch the scale."], ["A-5.4-02", "S5.4", "2", "Repeat click", "I-PEPPER", "Right panel", "T-BOWL", "Crack about ½ tbsp pepper (about 12 twists)", "Correct", "Perfect", "Be generous, pepper is a main flavour here.", "", "NEXT", "0", "", "Tap the pepper mill about 12 times over the bowl."], ["A-5.4-03", "S5.4", "3", "Hold", "T-BOWL", "Right panel", "T-BOWL", "Whisk until a thick, smooth paste", "Correct", "Perfect", "Thick and smooth. It will loosen with pasta water later.", "Add the cheese and pepper before whisking.", "NEXT", "0", "egg_paste = ready", "Hold to whisk until you have a thick, smooth paste."], ["A-5.4-04", "S5.4", "-", "Drag", "I-SALT", "Right panel", "T-BOWL", "Add salt to the eggs", "Incorrect", "Degraded", "", "No salt here. Pecorino brings plenty.", "NEXT", "-5", "salt_level += 1", ""], ["A-6.2-01", "S6.2", "1", "Drag", "I-SALT", "Right panel", "T-POT", "Salt as chosen in S6.1", "Correct", "Perfect", "", "", "NEXT", "0", "", "Add the salt you chose to the boiling water."], ["A-6.2-02", "S6.2", "2", "Drag", "I-SPAGHETTI", "Right panel", "T-POT", "300 g spaghetti", "Correct", "Perfect", "In it goes. Push it under as it softens.", "Salt the water first.", "NEXT", "0", "pasta_in = true", "Add the 300 g of spaghetti to the pot."], ["A-6.2-03", "S6.2", "3", "Repeat click", "T-TONGS", "Right panel", "T-POT", "Stir during the first minute", "Correct", "Perfect", "No sticking.", "", "NEXT", "0", "", "Tap the tongs to stir the pasta during the first minute so it doesn't stick."], ["A-6.2-04", "S6.2", "-", "Drag", "I-OIL", "Right panel", "T-POT", "Oil in the water", "Incorrect", "Recoverable", "", "Oil just floats on top. Stirring is what stops sticking. And oily pasta won't hold the sauce.", "NEXT", "-2", "", ""], ["A-6.2-05", "S6.2", "-", "Click", "I-SPAGHETTI", "Right panel", "", "Snap the spaghetti in half", "Incorrect", "Recoverable", "", "Mamma mia! Long strands are how you twirl. Push them under gently as they soften.", "NEXT", "-2", "", ""], ["A-7.1-01", "S7.1", "1", "Drag", "T-MUG", "Right panel", "T-POT", "Ladle about 1 cup of pasta water into the mug", "Correct", "Perfect", "Our insurance policy.", "Save the water before you move the pasta!", "NEXT", "0", "water_saved_ml = 240", "With the ladle, scoop about 1 cup of pasta water into the mug."], ["A-7.1-02", "S7.1", "2", "Slider / knob", "E-KNOB-FRONT", "Scene", "", "Lowest flame", "Correct", "Perfect", "", "", "NEXT", "0", "", "Turn the front burner knob to the lowest flame."], ["A-7.1-03", "S7.1", "3", "Drag", "T-TONGS", "Right panel", "T-SKILLET", "Lift the pasta from pot to pan (water clinging)", "Correct", "Perfect", "Straight in, starchy water and all.", "", "NEXT", "0", "pasta_in_pan = true", "With the tongs, lift the pasta from the pot into the skillet."], ["A-7.1-04", "S7.1", "4", "Repeat click", "T-TONGS", "Scene", "T-SKILLET", "Toss to coat in the oil (about 30 s)", "Correct", "Perfect", "Every strand coated in that flavoured oil.", "", "NEXT", "0", "", "Tap the tongs to toss the pasta in the oil for about 30 seconds."], ["A-7.1-05", "S7.1", "-", "Drag", "T-POT", "Scene", "E-SINK", "Drain the pot into the sink", "Incorrect", "Recoverable", "", "There goes the pasta water! If you saved a mug you're fine, otherwise the sauce has nothing to loosen it.", "NEXT", "-5", "water_saved_ml = 0 if not saved", ""], ["A-7.2-01", "S7.2", "1", "Drag", "T-MUG", "Right panel", "T-BOWL", "Pour 60 ml (¼ cup) slowly into the eggs", "Correct", "Perfect", "", "", "NEXT", "0", "", "Pour about 60 ml (¼ cup) of the pasta water slowly into the egg bowl."], ["A-7.2-02", "S7.2", "2", "Hold", "T-BOWL", "Right panel", "T-BOWL", "Whisk hard while pouring", "Correct", "Perfect", "Keep it moving so no egg sits in the hot water.", "", "NEXT", "0", "", "Hold to whisk hard while you pour."], ["A-7.2-03", "S7.2", "3", "Click", "T-BOWL", "Scene", "", "Check: pours like cream", "Correct", "Perfect", "Smooth and pourable. Ready for the pan.", "", "NEXT", "0", "eggs_tempered = true", "Check the sauce: it should pour like cream."], ["A-7.2-04", "S7.2", "-", "Drag", "T-MUG", "Right panel", "T-BOWL", "Dump all the hot water in at once without whisking", "Incorrect", "Degraded", "", "Some egg cooked into strands. Strain them out if you can. The rest will still work.", "NEXT", "-5", "egg_strands = true", ""], ["A-7.2-05", "S7.2", "-", "Click", "T-BOWL", "Right panel", "", "Skip tempering, pour the cold paste straight into the pan", "Incorrect", "Degraded", "", "Thick, cold paste hitting hot pasta cooks unevenly. Expect lumps and a higher scramble risk.", "NEXT", "-5", "eggs_tempered = false", ""], ["A-7.4-01", "S7.4", "1", "Drag", "T-BOWL", "Right panel", "T-SKILLET", "Pour the egg mixture over the pasta", "Correct", "Perfect", "Now toss, toss, toss!", "", "NEXT", "0", "eggs_in = true", "Pour the egg mixture over the pasta in the skillet."], ["A-7.4-02", "S7.4", "2", "Slider / knob", "E-TOSS-SPEED", "Scene", "", "Toss continuously (Slow / Medium / Fast); watch the thermometer, 62-70 °C", "Correct", "Perfect", "", "", "NEXT", "0", "", "Keep tossing. Watch the thermometer and stay between 62 and 70 °C."], ["A-7.4-03", "S7.4", "3", "Click", "E-PLATE-BTN", "Scene", "", "Plate when glossy and béchamel-thick", "Correct", "Perfect", "Look at that shine. Silky!", "", "NEXT", "0", "", "Plate it as soon as the sauce is glossy and coats the strands."], ["A-7.4-04", "S7.4", "opt", "Slider / knob", "E-KNOB-FRONT", "Scene", "", "Back to lowest flame briefly if runny", "Acceptable", "Recoverable", "", "Gentle heat to thicken. Keep it moving and come off again at the first sign of grains.", "NEXT", "0", "", ""], ["A-7.4-05", "S7.4", "opt", "Drag", "T-MUG", "Right panel", "T-SKILLET", "Splash of pasta water if too thick or too hot", "Acceptable", "Recoverable", "", "Water loosens it and cools it down at the same time.", "NEXT", "0", "", ""], ["A-7.4-06", "S7.4", "-", "Timer", "E-THERMO", "Scene", "", "Sauce stays above 70 °C (curds ≥ 0.65)", "Incorrect", "Fatal", "", "It's scrambled. The yolk proteins set into curds. There's no fixing this one.", "GAME_OVER", "-100", "ending = FATAL-SCRAMBLED", ""], ["A-7.4-07", "S7.4", "-", "Click", "E-PLATE-BTN", "Scene", "", "Plate while runny (thicken < 0.45)", "Incorrect", "Degraded", "", "Too thin. It pools in the bowl. A little gentle heat would have thickened it.", "NEXT", "-8", "", ""], ["A-7.4-08", "S7.4", "-", "Click", "E-PLATE-BTN", "Scene", "", "Plate while grainy (curds 0.3-0.65)", "Incorrect", "Degraded", "", "A few curds formed. Tasty, but not silky.", "NEXT", "-10", "", ""], ["A-8.2-01", "S8.2", "1", "Drag", "E-PLATE", "Scene", "T-SKILLET", "Fold most of the tofu back in", "Correct", "Perfect", "", "", "NEXT", "0", "", "Fold most of the crispy tofu back into the pasta."], ["A-8.2-02", "S8.2", "2", "Drag", "T-TONGS", "Right panel", "E-BOWLS", "Twirl a nest into each bowl (×2)", "Correct", "Perfect", "Twist the tongs against the pan to make a tidy nest.", "", "NEXT", "0", "", "With the tongs, twirl a nest of pasta into each serving bowl."], ["A-8.2-03", "S8.2", "3", "Repeat click", "I-PEPPER", "Right panel", "E-BOWLS", "Crack pepper over each bowl", "Correct", "Perfect", "", "", "NEXT", "0", "", "Tap the pepper mill to crack pepper over each bowl."], ["A-8.2-04", "S8.2", "4", "Hold", "I-PECORINO", "Right panel", "E-BOWLS", "Dust with pecorino (plus reserved crispy tofu on top)", "Correct", "Perfect", "", "", "NEXT", "0", "", "Hold to dust each bowl with pecorino, then top with the reserved tofu."], ["A-8.2-05", "S8.2", "5", "Click", "E-BELL", "Scene", "", "Ring the bell: serve immediately", "Correct", "Perfect", "Service! Hot and silky, straight to Table 6.", "", "NEXT", "0", "", "Ring the bell to serve right away."], ["A-8.2-06", "S8.2", "-", "Timer", "E-TIMER", "Scene", "", "Wait more than 60 s (sim) before serving", "Incorrect", "Degraded", "", "It's setting in the bowl. Carbonara waits for no one!", "NEXT", "-5", "sauce_set = true", ""]]}, "Chef Tips": {"head": ["Tip ID", "Substep ID", "Modal title", "Tip text", "Button label"], "rows": [["T-1.1", "S1.1", "Read the ticket twice", "Before anything touches a pan, read the order twice. Dietary needs change the ingredients, and a request like 'Roman-style' (so no cream) changes the method.", "Got it"], ["T-1.3", "S1.3", "Five ingredients, no shortcuts", "Real carbonara is pasta, eggs, pecorino, black pepper and a cured meat. Today tofu takes the meat's place. Creaminess comes from technique, not cream.", "Let's shop"], ["T-2.1", "S2.1", "Dry tofu, crisp tofu", "Tofu is mostly water. Press it under a weight and it browns instead of steaming. Use the time to start your pasta water.", "Start pressing"], ["T-2.3", "S2.3", "Same size, same cook", "Cut 1 cm cubes. Even pieces brown at the same rate, so none burn while others stay pale.", "Pick up the knife"], ["T-2.4", "S2.4", "Borrow guanciale's flavour", "Guanciale is salty, smoky and savoury. A splash of soy and a pinch of smoked paprika get the tofu part of the way there. Go easy on salt: pecorino is very salty.", "Season"], ["T-3.1", "S3.1", "Water first", "A big pot of water takes about 10 minutes to boil. Get it going now, and the rest of the prep fits around it.", "To the sink"], ["T-4.1", "S4.1", "Not every rule transfers", "Guanciale goes into a cold pan so its fat melts out slowly. Tofu has no fat to give. Think about what tofu needs instead.", "Choose"], ["T-4.2", "S4.2", "Hands off!", "Once the tofu is in the hot oil, leave it alone for about 3 minutes. The crust needs time to form. Move it too early and it tears and sticks.", "Fire up"], ["T-4.3", "S4.3", "Save that oil", "The oil in the pan now tastes of crispy, smoky tofu. It becomes the fat in your sauce, so don't pour it away.", "Got it"], ["T-5.2", "S5.2", "Yolks for richness", "Extra yolks make the sauce golden, rich and more forgiving, because yolks set at a higher temperature than whites.", "Crack on"], ["T-5.3", "S5.3", "Finer is better", "The finer the cheese, the faster and more evenly it melts into the egg. Coarse shreds go stringy and clump.", "Grate"], ["T-6.1", "S6.1", "Season the water, gently", "Pasta water should taste seasoned, not like the sea. In carbonara, go lighter: the water ends up in a sauce full of salty pecorino.", "Salt it"], ["T-6.3", "S6.3", "One minute early", "Pull the pasta a minute before al dente. It finishes cooking in the pan while the sauce comes together.", "Watch the clock"], ["T-7.1", "S7.1", "Never drain carbonara pasta", "Save a mug of pasta water first, then lift the pasta straight into the pan with tongs. The starchy water binds the sauce.", "Ready"], ["T-7.2", "S7.2", "Temper the eggs", "Whisk a little hot pasta water into the eggs before they go near the pan. It warms them gently, so they thicken instead of scrambling.", "Whisk"], ["T-7.3", "S7.3", "The magic numbers", "Egg yolk thickens at about 62 °C and scrambles above 70 °C. A pan on the flame is over 150 °C. The pasta's own heat is usually enough.", "Decide"], ["T-7.4", "S7.4", "Keep it moving", "Toss constantly. Too thin? Brief, gentle heat. Too thick or too hot? A splash of pasta water. You can always thicken a sauce, but you can't unscramble one.", "Toss!"], ["T-8.2", "S8.2", "Serve it now", "Carbonara thickens as it cools. Plate it, top it, and get it to the table straight away.", "Plate up"]]}, "Scene & Items": {"head": ["Element / item ID", "Name", "Location", "Visual description", "Interactions"], "rows": [["I-SPAGHETTI", "Spaghetti, 300 g", "Right panel", "Dried bronze-cut spaghetti in a paper pack", "Select; drag into pot"], ["I-TOFU", "Extra-firm tofu, 280 g", "Both", "Block in a water-filled pack; becomes a pressed block, then 1 cm cubes, then golden cubes", "Select; drag; cut; fry"], ["I-EGGS", "Eggs", "Right panel", "Carton of 6 brown eggs", "Select; crack; separate"], ["I-PECORINO", "Pecorino Romano, 150 g", "Right panel", "Wedge with black rind", "Select; grate"], ["I-PEPPER", "Black peppercorns / pepper mill", "Right panel", "Wooden pepper mill", "Select; repeat-click to grind"], ["I-SALT", "Coarse salt", "Right panel", "Salt cellar with a measuring spoon", "Select; drag"], ["I-OIL", "Olive oil", "Right panel", "Bottle with pour spout", "Select; drag (2 tbsp)"], ["I-SOY", "Soy sauce", "Right panel", "Small bottle", "Select; drag"], ["I-PAPRIKA", "Smoked paprika", "Right panel", "Small tin", "Select; drag (pinch)"], ["I-GUANCIALE", "Guanciale (decoy)", "Right panel", "Cured pork cheek", "Select (incorrect)"], ["I-CREAM", "Heavy cream (decoy)", "Right panel", "Carton", "Select (incorrect)"], ["I-GARLIC", "Garlic (decoy)", "Right panel", "Bulb", "Select (incorrect)"], ["I-BUTTER", "Butter (decoy)", "Right panel", "Block in foil", "Select (incorrect)"], ["I-PARSLEY", "Parsley (decoy)", "Right panel", "Bunch", "Select (incorrect)"], ["T-POT", "Large pot with lid", "Both", "5 L stainless pot with fill line at 3 L", "Select; drag; lid"], ["T-SKILLET", "Cast-iron skillet", "Both", "The skillet from the 3D kitchen", "Drop target for oil, tofu, pasta, eggs"], ["T-KNIFE", "Chef's knife", "Right panel", "With the cutting board", "Select; click cut guides"], ["T-TOWELS", "Kitchen towels (2)", "Right panel", "Folded linen towels", "Select; drag"], ["T-GRATER", "Box grater", "Right panel", "Four sides: star (fine), medium, large, slicer", "Select; choose side"], ["T-BOWL", "Mixing bowl and whisk", "Both", "Ceramic bowl", "Select; whisk (hold)"], ["T-SLOTTED", "Slotted spoon", "Right panel", "Steel slotted spoon", "Select; drag"], ["T-TONGS", "Tongs", "Right panel", "Steel tongs", "Select; drag; toss"], ["T-MUG", "Ladle and mug", "Right panel", "Ladle and a ceramic mug for pasta water", "Select; drag; pour"], ["T-COLANDER", "Colander (decoy)", "Right panel", "Steel colander", "Select (incorrect)"], ["T-BLENDER", "Blender (decoy)", "Right panel", "Countertop blender", "Select (incorrect)"], ["T-TRAY", "Baking tray (decoy)", "Right panel", "Sheet pan", "Select (incorrect)"], ["E-BOARD", "Cutting board", "Scene", "Wooden board on the counter", "Drop target"], ["E-CUT-GUIDES", "Cutting guides", "Scene", "Dashed lines projected on the tofu; sets A, B, C (correct) and X (decoy)", "Click a line set to cut"], ["E-WEIGHT", "Heavy pan (weight)", "Right panel", "Spare cast-iron pan used as a press", "Drag on top of tofu"], ["E-SINK", "Sink", "Scene", "Sink to the left of the stove", "Drop target"], ["E-TAP", "Tap", "Scene", "Mixer tap", "Hold to fill"], ["E-BURNER-BACK", "Back burner", "Scene", "Gas burner for the pasta pot", "Drop target"], ["E-KNOB-BACK", "Back burner knob", "Scene", "Off / Low / Medium / High", "Turn"], ["E-KNOB-FRONT", "Front burner knob", "Scene", "Off / Lowest / Low / Medium / High", "Turn"], ["E-PAN-OIL", "Oil in the pan", "Scene", "Shimmers when hot", "Observe; click to check"], ["E-TIMER", "Kitchen timer", "Scene", "Wait-time chooser with fast-forward", "Choose a time"], ["E-PLATE", "Resting plate", "Scene", "Small plate with paper towel for the tofu", "Drop target"], ["E-COUNTER", "Counter", "Scene", "Butcher-block counter", "Drop target"], ["E-WHITES-CUP", "Cup for whites", "Scene", "Small glass cup", "Drop target"], ["E-TOSS-SPEED", "Toss speed control", "Scene", "Slow / Medium / Fast", "Select"], ["E-THERMO", "Sauce thermometer", "Scene", "Live gauge with 62 °C and 70 °C marks", "Observe"], ["E-PLATE-BTN", "Plate it button", "Scene", "Ends the tossing", "Click"], ["E-BOWLS", "Serving bowls (2)", "Scene", "Warm pasta bowls", "Drop target"], ["E-BELL", "Service bell", "Scene", "Brass bell on the pass", "Click to serve"]]}, "Outcomes": {"head": ["Ending ID", "Trigger", "Result title", "Customer reaction", "Nonna Pina", "Screen notes"], "rows": [["END-PERFECT", "Score ≥ 90 and no Fatal outcome", "Nonna-approved", "Saumya: \"This is incredible. Crispy tofu, silky sauce, and not a drop of cream. Can I get the recipe?\"", "Perfetto. That's a real carbonara, tofu and all.", "Recap all steps; unlock 'Carbonara master' badge."], ["END-GOOD", "Score 75-89 and no Fatal outcome", "Very good", "Saumya: \"Really tasty! Maybe just a touch [saltier / thicker / softer] than I'd expect.\"", "Good work. One or two things to tighten up.", "Show the Degraded notes as 'Next time'."], ["END-OK", "Score 50-74 and no Fatal outcome", "Edible", "Saumya: \"Thanks, it's... fine. The sauce was a bit off.\"", "It's dinner. Let's look at what went sideways.", "Show the Degraded notes and offer to replay those steps."], ["END-POOR", "Score < 50 and no Fatal outcome", "Sent back", "Saumya: \"Sorry, I don't think I can finish this.\"", "Every cook has nights like this. Let's try again.", "Offer a full restart."], ["FATAL-SALT", "S6.1 half a cup of salt", "Too salty to serve", "(Dish never leaves the kitchen.)", "Seawater pasta can't be saved. Salt lightly: the cheese does the rest.", "Game over; restart from S6.1."], ["FATAL-BURNT", "S4.2 high heat too long", "Burnt tofu", "(Smoke alarm; dish never leaves the kitchen.)", "Burnt oil turns everything bitter. Medium heat, and patience.", "Game over; restart from S4.1."], ["FATAL-SCRAMBLED", "S7.3 heat turned up, or S7.4 sauce held above 70 °C", "Scrambled eggs", "(Dish never leaves the kitchen.)", "Above 70 °C the yolk sets into curds. Off the heat, keep tossing, and use that pasta water.", "Game over; restart from S7.1."]]}, "Thresholds": [["Starting score", "100"], ["END-PERFECT minimum", "90"], ["END-GOOD minimum", "75"], ["END-OK minimum", "50"]], "Guide": [["Screen layout", ""], ["Left panel", "The step/substep title and the instruction or question (Flow: column G)."], ["Right panel", "Options (MCQ Options tab) or items and tools for procedures (Scene & Items tab, Location = Right panel)."], ["Chef tip modal", "Opens at the start of a substep when Flow column I names a tip (Chef Tips tab). Dismissed with its button label."], ["3D scene", "Clickable elements (Scene & Items tab, Location = Scene). Camera view set per substep (Flow: column J)."], ["How the tabs connect", ""], ["Order", "The customer order that opens the simulation. Feeds S1.1."], ["Flow", "Steps and substeps in play order. 'On pass →' gives the next substep ID (END = Outcomes screen)."], ["MCQ Options", "One row per option for MCQ substeps. Substep ID links to Flow."], ["Procedure Actions", "One row per action for Procedure substeps. 'Order' is the correct sequence; '-' marks a wrong action, 'opt' an optional one."], ["Chef Tips", "Modal content. Tip ID links from Flow."], ["Scene & Items", "Every element and item referenced by ID in the other tabs."], ["Outcomes", "Endings, customer reactions and score thresholds."], ["Lists", "Values for the dropdowns. Add a value here before using it elsewhere."], ["Substep types", ""], ["MCQ - Single select", "One answer. Each option has its own feedback, outcome and branch."], ["MCQ - Multi select", "Pick a set. Pass = every Correct option chosen and no Incorrect ones; Acceptable options are allowed. Missing items trigger Flow column L feedback."], ["Procedure", "The learner performs actions on scene elements and right-panel items in the order given. Out-of-order attempts show the 'out of order' feedback."], ["Outcome scale", ""], ["Perfect", "Correct; full marks."], ["Acceptable", "Not ideal, but fine. No or small penalty."], ["Recoverable", "Mistake const TABS = ['Guide', 'Order', 'Flow', 'MCQ Options', 'Procedure Actions', 'Chef Tips', 'Scene & Items', 'Outcomes'];
const SLUG = (t) => t.toLowerCase().replace(/[^a-z]+/g, '-').replace(/^-|-$/g, '');
const CHIP_COLS = new Set(['Correctness', 'Outcome', 'Type']);
const ID_COLS = new Set(['Substep ID', 'Option ID', 'Action ID', 'Tip ID', 'Element / item ID', 'Ending ID',
  'Item ID', 'Chef tip at start (ID)', 'On pass →', 'Branch to', 'Source element / item', 'Target element']);
const LONG = /instruction|feedback|text|learning|reaction|description|parameter|pass rule|nonna|notes|label|scene state|right panel|trigger|effect|interactions/i;
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

const flow = DATA['Flow'];
const fi = (h) => flow.head.indexOf(h);
const substeps = flow.rows.map((r) => ({ id: r[fi('Substep ID')], title: r[fi('Substep title')], type: r[fi('Type')],
  step: r[fi('Step')], stepTitle: r[fi('Step title')] }));
const subById = Object.fromEntries(substeps.map((s) => [s.id, s]));

document.getElementById('counts').textContent =
  `${new Set(substeps.map((s) => s.step)).size} steps · ${substeps.length} substeps · ` +
  `${DATA['MCQ Options'].rows.length} MCQ options · ${DATA['Procedure Actions'].rows.length} procedure actions · ` +
  `${DATA['Chef Tips'].rows.length} chef tips`;

const sel = document.getElementById('f-sub');
substeps.forEach((s) => sel.insertAdjacentHTML('beforeend', `<option value="${esc(s.id)}">${esc(s.id)} · ${esc(s.title)}</option>`));

const tabsEl = document.getElementById('tabs');
TABS.forEach((t) => tabsEl.insertAdjacentHTML('beforeend',
  `<button role="tab" id="tab-${SLUG(t)}" aria-selected="false" data-tab="${esc(t)}">${esc(t)}</button>`));

let current = 'Flow';
try { current = localStorage.getItem('flow-tab') || current; } catch (e) { /* storage unavailable */ }
const fromHash = TABS.find((t) => SLUG(t) === location.hash.slice(1));
if (fromHash) current = fromHash;
if (!TABS.includes(current)) current = 'Flow';

function highlight(text, q) {
  const safe = esc(text);
  if (!q) return safe;
  const i = text.toLowerCase().indexOf(q);
  if (i < 0) return safe;
  return esc(text.slice(0, i)) + '<mark>' + esc(text.slice(i, i + q.length)) + '</mark>' + esc(text.slice(i + q.length));
}

function cell(h, v, q) {
  if (v === '') return '<td></td>';
  if (CHIP_COLS.has(h)) return `<td><span class="chip ${h === 'Type' ? 'type' : esc(v)}">${esc(v)}</span></td>`;
  if (ID_COLS.has(h)) return `<td class="id">${highlight(v, q)}</td>`;
  if (/^-?\d+$/.test(v) && h.length < 14) return `<td class="num">${esc(v)}</td>`;
  const cls = LONG.test(h) ? 'long' : (v.length > 40 ? 'mid' : '');
  return `<td class="${cls}">${highlight(v, q).replace(/\n/g, '<br>')}</td>`;
}

function renderTable(name, q, sub) {
  const t = DATA[name];
  const subCol = t.head.indexOf('Substep ID');
  const isFlow = name === 'Flow';
  const hideCols = new Set(isFlow ? [t.head.indexOf('Step'), t.head.indexOf('Step title')] : []);
  const cols = t.head.map((h, i) => i).filter((i) => !hideCols.has(i));
  let rows = t.rows;
  if (sub && subCol >= 0) rows = rows.filter((r) => r[subCol] === sub);
  if (q) rows = rows.filter((r) => r.some((v) => v.toLowerCase().includes(q)));
  if (!rows.length) return '<div class="scroll"><p class="empty">No rows match. Clear the search or pick another substep.</p></div>';

  let html = '<div class="scroll"><table><thead><tr>' + cols.map((i) => `<th scope="col">${esc(t.head[i])}</th>`).join('') + '</tr></thead><tbody>';
  let lastGroup = null;
  rows.forEach((r) => {
    let group = null, label = '';
    if (isFlow) {
      group = r[t.head.indexOf('Step')];
      label = `Step ${esc(group)} · ${esc(r[t.head.indexOf('Step title')])}`;
    } else if (subCol >= 0) {
      group = r[subCol];
      const s = subById[group];
      label = s ? `${esc(group)} · ${esc(s.title)}<span class="band-meta">${esc(s.type)} · Step ${esc(s.step)}</span>` : esc(group);
    }
    if (group !== null && group !== lastGroup) {
      html += `<tr class="band"><td colspan="${cols.length}">${label}</td></tr>`;
      lastGroup = group;
    }
    html += '<tr>' + cols.map((i) => cell(t.head[i], r[i], q)).join('') + '</tr>';
  });
  return html + '</tbody></table></div>';
}

function renderPairs(pairs, q, sectionTest) {
  const list = q ? pairs.filter((p) => (p[0] + ' ' + p[1]).toLowerCase().includes(q)) : pairs;
  if (!list.length) return '<p class="empty">No rows match.</p>';
  return '<dl class="sheet">' + list.map(([k, v]) => {
    if (sectionTest(k, v)) return `<dt class="section">${esc(k)}</dt><dd class="section"></dd>`;
    const body = k === 'Printed ticket text' ? `<pre class="ticket">${esc(v)}</pre>` : highlight(v, q);
    return `<dt>${esc(k)}</dt><dd>${body}</dd>`;
  }).join('') + '</dl>';
}

function render() {
  const q = document.getElementById('f-q').value.trim().toLowerCase();
  const sub = sel.value;
  const hasSub = ['Flow', 'MCQ Options', 'Procedure Actions', 'Chef Tips'].includes(current);
  document.querySelector('label[for="f-sub"]').hidden = !hasSub;
  document.querySelectorAll('[role="tab"]').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.tab === current)));
  const hints = {
    'Procedure Actions': 'Order: 1, 2, 3… is the correct sequence; ‘-’ is a wrong action; ‘opt’ is an optional helper.',
    'MCQ Options': 'Multi-select substeps pass when every Correct option is picked and no Incorrect one is.',
    'Flow': 'Left panel = instruction or question. Right panel = options or items. Chef tip opens as a modal before the substep.',
  };
  document.getElementById('hint').textContent = hints[current] || '';
  const view = document.getElementById('view');
  if (current === 'Order') view.innerHTML = renderPairs(DATA['Order'], q, (k, v) => v === '');
  else if (current === 'Guide') view.innerHTML = renderPairs(DATA['Guide'], q, (k, v) => v === '');
  else view.innerHTML = renderTable(current, q, hasSub ? sub : '') +
    (current === 'Outcomes' && DATA['Thresholds'].length
      ? '<h2 class="eyebrow" style="margin:18px 0 8px">Score thresholds</h2>' + renderPairs(DATA['Thresholds'], '', () => false) : '');
}

tabsEl.addEventListener('click', (e) => {
  const b = e.target.closest('[data-tab]');
  if (!b) return;
  current = b.dataset.tab;
  try { localStorage.setItem('flow-tab', current); } catch (err) { /* ignore */ }
  render();
});
sel.addEventListener('change', render);
document.getElementById('f-q').addEventListener('input', render);
render();
</script>
